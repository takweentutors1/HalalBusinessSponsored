<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none">
  <defs>
    <filter id="blur14" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <!-- Abstract starburst / emphasis lines -->
  <g opacity="0.06" stroke="white" stroke-width="0.8" fill="none" stroke-linecap="round">
    <line x1="400" y1="20" x2="400" y2="50"/>
    <line x1="400" y1="150" x2="400" y2="180"/>
    <line x1="200" y1="100" x2="230" y2="100"/>
    <line x1="570" y1="100" x2="600" y2="100"/>
    <line x1="280" y1="40" x2="300" y2="60"/>
    <line x1="500" y1="140" x2="520" y2="160"/>
    <line x1="520" y1="40" x2="500" y2="60"/>
    <line x1="300" y1="140" x2="280" y2="160"/>
  </g>
  
  <!-- Scattered diamonds -->
  <g opacity="0.05" fill="white">
    <rect x="148" y="88" width="6" height="6" rx="1" transform="rotate(45 151 91)"/>
    <rect x="648" y="88" width="6" height="6" rx="1" transform="rotate(45 651 91)"/>
    <rect x="398" y="18" width="5" height="5" rx="1" transform="rotate(45 400.5 20.5)"/>
    <rect x="398" y="178" width="5" height="5" rx="1" transform="rotate(45 400.5 180.5)"/>
  </g>
  
  <!-- Soft glow -->
  <circle cx="400" cy="100" r="100" fill="white" opacity="0.03" filter="url(#blur14)"/>
</svg>
