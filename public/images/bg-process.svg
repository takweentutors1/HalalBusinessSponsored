<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none">
  <defs>
    <filter id="blur11" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <!-- Numbered steps along a path -->
  <path d="M80,100 C200,60 350,140 500,80 S700,100 750,90" 
        stroke="#a8e6cf" stroke-width="1" fill="none" opacity="0.15" stroke-dasharray="6 8"/>
  
  <!-- Step markers (circles with numbers) -->
  <g opacity="0.08">
    <circle cx="120" cy="88" r="10" stroke="#10b981" stroke-width="1" fill="none"/>
    <circle cx="250" cy="118" r="10" stroke="#10b981" stroke-width="1" fill="none"/>
    <circle cx="380" cy="95" r="10" stroke="#10b981" stroke-width="1" fill="none"/>
    <circle cx="500" cy="80" r="10" stroke="#10b981" stroke-width="1" fill="none"/>
    <circle cx="620" cy="92" r="10" stroke="#10b981" stroke-width="1" fill="none"/>
    <circle cx="720" cy="90" r="10" stroke="#10b981" stroke-width="1" fill="none"/>
  </g>
  
  <!-- Connecting arrows -->
  <g opacity="0.06" stroke="#a8e6cf" stroke-width="0.6" fill="none">
    <path d="M135,92 C170,80 210,100 235,114"/>
    <path d="M265,114 C290,105 340,90 365,95"/>
    <path d="M395,93 C420,85 460,78 485,80"/>
    <path d="M515,80 C540,82 580,88 605,90"/>
  </g>
  
  <!-- Soft glow -->
  <ellipse cx="400" cy="100" rx="200" ry="50" fill="#d7f5e4" opacity="0.05" filter="url(#blur11)"/>
</svg>
