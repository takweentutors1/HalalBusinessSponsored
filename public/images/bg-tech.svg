<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none">
  <defs>
    <filter id="blur7" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <!-- Server/rack shapes -->
  <g opacity="0.12" stroke="#a8e6cf" stroke-width="0.8" fill="none">
    <rect x="100" y="50" width="60" height="15" rx="2"/>
    <rect x="100" y="70" width="60" height="15" rx="2"/>
    <rect x="100" y="90" width="60" height="15" rx="2"/>
    <circle cx="112" cy="57.5" r="2" fill="#a8e6cf" fill-opacity="0.3"/>
    <circle cx="112" cy="77.5" r="2" fill="#a8e6cf" fill-opacity="0.3"/>
    <circle cx="112" cy="97.5" r="2" fill="#a8e6cf" fill-opacity="0.3"/>
  </g>
  
  <!-- Globe/domain shape -->
  <circle cx="350" cy="80" r="25" stroke="#d7f5e4" stroke-width="0.8" fill="none" opacity="0.15"/>
  <ellipse cx="350" cy="80" rx="25" ry="10" stroke="#d7f5e4" stroke-width="0.6" fill="none" opacity="0.1"/>
  <line x1="325" y1="80" x2="375" y2="80" stroke="#d7f5e4" stroke-width="0.6" opacity="0.1"/>
  <line x1="350" y1="55" x2="350" y2="105" stroke="#d7f5e4" stroke-width="0.6" opacity="0.1"/>
  
  <!-- Connection lines -->
  <g opacity="0.08" stroke="#a8e6cf" stroke-width="0.6" stroke-dasharray="3 5">
    <path d="M160,75 C200,60 280,60 325,80"/>
    <path d="M375,80 C420,60 500,60 540,75"/>
  </g>
  
  <!-- Cloud shape -->
  <path d="M520,55 Q535,40 555,45 Q575,35 590,50 Q610,45 615,60 Q625,60 625,72 Q625,85 610,85 L530,85 Q515,85 515,72 Q515,60 520,55Z" 
        stroke="#d7f5e4" stroke-width="0.8" fill="none" opacity="0.12"/>
  
  <!-- Dots -->
  <circle cx="250" cy="130" r="1.5" fill="#d7f5e4" opacity="0.2"/>
  <circle cx="450" cy="140" r="2" fill="#a8e6cf" opacity="0.15"/>
  <circle cx="650" cy="50" r="1.8" fill="#d7f5e4" opacity="0.2"/>
  
  <!-- Soft glow -->
  <ellipse cx="350" cy="80" rx="120" ry="50" fill="#d7f5e4" opacity="0.06" filter="url(#blur7)"/>
</svg>
