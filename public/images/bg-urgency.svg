<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none">
  <defs>
    <filter id="blur10" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <!-- Clock/timer arc -->
  <circle cx="400" cy="100" r="40" stroke="#a8e6cf" stroke-width="1" fill="none" opacity="0.15"/>
  <line x1="400" y1="100" x2="400" y2="72" stroke="#10b981" stroke-width="1" opacity="0.12" stroke-linecap="round"/>
  <line x1="400" y1="100" x2="420" y2="90" stroke="#10b981" stroke-width="0.8" opacity="0.1" stroke-linecap="round"/>
  
  <!-- Tick marks -->
  <g opacity="0.08" stroke="#a8e6cf" stroke-width="0.8">
    <line x1="400" y1="58" x2="400" y2="62"/>
    <line x1="442" y1="100" x2="438" y2="100"/>
    <line x1="400" y1="142" x2="400" y2="138"/>
    <line x1="358" y1="100" x2="362" y2="100"/>
  </g>
  
  <!-- Scattered urgency dots -->
  <circle cx="150" cy="60" r="2" fill="#10b981" opacity="0.08"/>
  <circle cx="250" cy="130" r="2.5" fill="#a8e6cf" opacity="0.07"/>
  <circle cx="550" cy="50" r="2" fill="#d7f5e4" opacity="0.08"/>
  <circle cx="650" cy="140" r="1.8" fill="#10b981" opacity="0.07"/>
  
  <!-- Soft glow -->
  <circle cx="400" cy="100" r="80" fill="#d7f5e4" opacity="0.06" filter="url(#blur10)"/>
</svg>
