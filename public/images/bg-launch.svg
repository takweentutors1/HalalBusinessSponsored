<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none">
  <defs>
    <filter id="blur8" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <!-- Forward arrows / launch trajectory -->
  <g opacity="0.1" stroke="#10b981" stroke-width="1" fill="none" stroke-linecap="round">
    <path d="M100,140 C250,120 400,80 700,60"/>
    <polyline points="690,54 705,60 690,66"/>
  </g>
  <g opacity="0.07" stroke="#a8e6cf" stroke-width="0.8" fill="none" stroke-linecap="round">
    <path d="M100,160 C250,145 400,110 700,90"/>
    <polyline points="690,84 705,90 690,96"/>
  </g>
  
  <!-- Milestone dots along trajectory -->
  <circle cx="200" cy="130" r="3" fill="#d7f5e4" opacity="0.2"/>
  <circle cx="350" cy="100" r="3" fill="#a8e6cf" opacity="0.2"/>
  <circle cx="500" cy="78" r="3" fill="#d7f5e4" opacity="0.2"/>
  <circle cx="650" cy="64" r="3" fill="#a8e6cf" opacity="0.2"/>
  
  <!-- Scattered dots -->
  <circle cx="180" cy="50" r="1.5" fill="#d7f5e4" opacity="0.2"/>
  <circle cx="400" cy="40" r="2" fill="#a8e6cf" opacity="0.15"/>
  <circle cx="600" cy="120" r="1.8" fill="#d7f5e4" opacity="0.2"/>
  
  <!-- Soft glow -->
  <ellipse cx="400" cy="100" rx="200" ry="60" fill="#d7f5e4" opacity="0.06" filter="url(#blur8)"/>
</svg>
