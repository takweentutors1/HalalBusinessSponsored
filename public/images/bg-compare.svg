<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none">
  <defs>
    <filter id="blur5" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <!-- Vertical divider line -->
  <line x1="400" y1="30" x2="400" y2="170" stroke="#d1d5db" stroke-width="0.8" stroke-dasharray="4 6" opacity="0.3"/>
  
  <!-- Left side: checkmarks -->
  <g opacity="0.08" stroke="#10b981" stroke-width="1.2" fill="none" stroke-linecap="round">
    <path d="M120,60 l6,6 l12,-12"/>
    <path d="M200,80 l6,6 l12,-12"/>
    <path d="M280,60 l6,6 l12,-12"/>
    <path d="M160,120 l6,6 l12,-12"/>
    <path d="M240,140 l6,6 l12,-12"/>
  </g>
  
  <!-- Right side: plus signs -->
  <g opacity="0.08" stroke="#f59e0b" stroke-width="1" fill="none" stroke-linecap="round">
    <line x1="518" y1="55" x2="532" y2="55"/><line x1="525" y1="48" x2="525" y2="62"/>
    <line x1="618" y1="75" x2="632" y2="75"/><line x1="625" y1="68" x2="625" y2="82"/>
    <line x1="558" y1="115" x2="572" y2="115"/><line x1="565" y1="108" x2="565" y2="122"/>
    <line x1="698" y1="55" x2="712" y2="55"/><line x1="705" y1="48" x2="705" y2="62"/>
    <line x1="658" y1="135" x2="672" y2="135"/><line x1="665" y1="128" x2="665" y2="142"/>
  </g>
  
  <!-- Subtle glow -->
  <ellipse cx="250" cy="100" rx="130" ry="60" fill="#d7f5e4" opacity="0.06" filter="url(#blur5)"/>
  <ellipse cx="600" cy="100" rx="130" ry="60" fill="#fef3c7" opacity="0.05" filter="url(#blur5)"/>
</svg>
